<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">Rayon, diamètre et corde</title><desc id="desc">O est le centre ; OT est un rayon de 3 cm, AB un diamètre de 6 cm, et CD une corde qui ne passe pas par O.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><circle cx="280" cy="160" r="90" fill="#eff6fb" stroke="#174d76" stroke-width="3"/><line x1="190" y1="160" x2="370" y2="160" stroke="#174d76" stroke-width="3"/><line x1="280" y1="160" x2="280" y2="70" stroke="#174d76" stroke-width="3"/><line x1="205.17" y1="210" x2="354.83" y2="210" stroke="#174d76" stroke-width="3"/><circle cx="280" cy="160" r="4" fill="#174d76"/><text x="280" y="182" font-size="16" fill="#172b3a" text-anchor="middle">O</text><text x="175" y="163" font-size="19" fill="#172b3a" text-anchor="middle">A</text><text x="386" y="163" font-size="19" fill="#172b3a" text-anchor="middle">B</text><text x="280" y="54" font-size="19" fill="#172b3a" text-anchor="middle">T</text><text x="195" y="232" font-size="19" fill="#172b3a" text-anchor="middle">C</text><text x="367" y="232" font-size="19" fill="#172b3a" text-anchor="middle">D</text><text x="323" y="117" font-size="17" fill="#172b3a" text-anchor="middle">3 cm</text><text x="280" y="279" font-size="18" fill="#172b3a" text-anchor="middle">diamètre AB : 6 cm</text></g></svg>