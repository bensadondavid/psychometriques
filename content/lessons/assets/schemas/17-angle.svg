<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">Une ouverture de 40 degrés</title><desc id="desc">O est le sommet ; A et B sont sur les demi-droites qui définissent l’angle de 40 degrés.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><line x1="130" y1="255" x2="480" y2="255" stroke="#174d76" stroke-width="3"/><line x1="130" y1="255" x2="398" y2="30" stroke="#174d76" stroke-width="3"/><path d="M195.0,255.0 A65,65 0 0,0 179.79288880273356,213.21880537037495" fill="none" stroke="#b45309" stroke-width="2.5"/><circle cx="130" cy="255" r="4" fill="#174d76"/><text x="113" y="282" font-size="19" fill="#172b3a" text-anchor="middle">O</text><text x="480" y="283" font-size="19" fill="#172b3a" text-anchor="middle">A</text><text x="412" y="40" font-size="19" fill="#172b3a" text-anchor="middle">B</text><text x="220" y="236" font-size="19" fill="#172b3a" text-anchor="middle">40°</text></g></svg>