<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">Pavé droit en perspective</title><desc id="desc">Longueur 4 cm, largeur 3 cm, hauteur 2 cm. Les arêtes cachées sont en pointillés. Volume 24 cm cubes. La perspective ne conserve pas les mesures apparentes.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><polygon points="150,255 390,255 390,135 150,135" fill="#e8f2fb" stroke="#174d76" stroke-width="3"/><polygon points="150,135 240,65 480,65 390,135" fill="#f8fafc" stroke="#174d76" stroke-width="3"/><polygon points="390,255 480,185 480,65 390,135" fill="#dbeafe" stroke="#174d76" stroke-width="3"/><line x1="150" y1="255" x2="240" y2="185" stroke="#174d76" stroke-width="3" stroke-dasharray="7 5"/><line x1="240" y1="185" x2="480" y2="185" stroke="#174d76" stroke-width="3" stroke-dasharray="7 5"/><line x1="240" y1="185" x2="240" y2="65" stroke="#174d76" stroke-width="3" stroke-dasharray="7 5"/><text x="270" y="290" font-size="19" fill="#172b3a" text-anchor="middle">4 cm</text><text x="122" y="201" font-size="19" fill="#172b3a" text-anchor="middle">2 cm</text><text x="460" y="242" font-size="19" fill="#172b3a" text-anchor="middle">3 cm</text><text x="300" y="320" font-size="17" fill="#172b3a" text-anchor="middle">12 cubes par couche, 2 couches : 24 cm³</text></g></svg>