<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">Hauteur et côté incliné</title><desc id="desc">La base mesure 8 cm, la hauteur perpendiculaire 3 cm et le côté incliné 5 cm. Aire 24 cm carrés.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><polygon points="150,250 390,250 510,160 270,160" fill="#e8f2fb" stroke="#174d76" stroke-width="3"/><line x1="270" y1="160" x2="270" y2="250" stroke="#174d76" stroke-width="3" stroke-dasharray="7 5"/><polygon points="270,236 284,236 284,250 270,250" fill="none" stroke="#174d76" stroke-width="2"/><text x="269" y="287" font-size="19" fill="#172b3a" text-anchor="middle">base : 8 cm</text><text x="322" y="219" font-size="17" fill="#172b3a" text-anchor="middle">h = 3 cm</text><text x="176" y="187" font-size="19" fill="#172b3a" text-anchor="middle">5 cm</text></g></svg>