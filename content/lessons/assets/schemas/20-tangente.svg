<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">Une tangente et un rayon perpendiculaires</title><desc id="desc">O est le centre ; T le point de contact ; P est extérieur. OT vaut 3 cm, PT 4 cm et OP 5 cm. L’angle OTP est droit.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><circle cx="210" cy="175" r="75" fill="#eff6fb" stroke="#174d76" stroke-width="3"/><line x1="210" y1="175" x2="335" y2="175" stroke="#174d76" stroke-width="3"/><line x1="210" y1="175" x2="255" y2="115" stroke="#174d76" stroke-width="3"/><line x1="255" y1="115" x2="335" y2="175" stroke="#b45309" stroke-width="3"/><polygon points="255,115 249,123 257,129 263,121" fill="none" stroke="#174d76" stroke-width="2"/><circle cx="210" cy="175" r="4" fill="#174d76"/><circle cx="335" cy="175" r="4" fill="#174d76"/><circle cx="255" cy="115" r="4" fill="#174d76"/><text x="195" y="194" font-size="19" fill="#172b3a" text-anchor="middle">O</text><text x="344" y="194" font-size="19" fill="#172b3a" text-anchor="middle">P</text><text x="253" y="99" font-size="19" fill="#172b3a" text-anchor="middle">T</text><text x="204" y="133" font-size="17" fill="#172b3a" text-anchor="middle">3 cm</text><text x="302" y="132" font-size="17" fill="#172b3a" text-anchor="middle">4 cm</text><text x="280" y="272" font-size="17" fill="#172b3a" text-anchor="middle">OP = 5 cm</text><text x="300" y="310" font-size="18" fill="#172b3a" text-anchor="middle">OT perp. PT</text></g></svg>