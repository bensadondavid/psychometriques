<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">Base et hauteur associée</title><desc id="desc">AB mesure 6 cm et la hauteur perpendiculaire depuis C mesure 4 cm. Aire : 12 cm carrés.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><polygon points="120,255 420,255 230,55" fill="#e8f2fb" stroke="#174d76" stroke-width="3"/><line x1="230" y1="55" x2="230" y2="255" stroke="#174d76" stroke-width="3" stroke-dasharray="7 5"/><polygon points="230,240 245,240 245,255 230,255" fill="none" stroke="#174d76" stroke-width="2"/><text x="270" y="293" font-size="19" fill="#172b3a" text-anchor="middle">base : 6 cm</text><text x="292" y="222" font-size="17" fill="#172b3a" text-anchor="middle">h = 4 cm</text><text x="104" y="275" font-size="19" fill="#172b3a" text-anchor="middle">A</text><text x="437" y="275" font-size="19" fill="#172b3a" text-anchor="middle">B</text><text x="230" y="38" font-size="19" fill="#172b3a" text-anchor="middle">C</text></g></svg>