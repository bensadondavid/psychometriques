<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">Angles correspondants sur deux parallèles</title><desc id="desc">Deux parallèles horizontales sont coupées par une sécante. Les angles en haut à droite aux intersections valent 60 degrés.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><line x1="70" y1="105" x2="535" y2="105" stroke="#174d76" stroke-width="3"/><line x1="70" y1="240" x2="535" y2="240" stroke="#174d76" stroke-width="3"/><line x1="175" y1="300" x2="330" y2="31.53" stroke="#174d76" stroke-width="3"/><path d="M322.28,105.0 A35,35 0 0,0 304.78,74.68911086754466" fill="none" stroke="#b45309" stroke-width="2.5"/><text x="343.28" y="85" font-size="18" fill="#172b3a" text-anchor="middle">60°</text><path d="M244.34,240.0 A35,35 0 0,0 226.84,209.68911086754466" fill="none" stroke="#b45309" stroke-width="2.5"/><text x="265.34000000000003" y="220" font-size="18" fill="#172b3a" text-anchor="middle">60°</text><text x="90" y="88" font-size="19" fill="#172b3a" text-anchor="middle">d1</text><text x="90" y="225" font-size="19" fill="#172b3a" text-anchor="middle">d2</text><text x="457" y="298" font-size="18" fill="#172b3a" text-anchor="middle">d1 // d2</text></g></svg>