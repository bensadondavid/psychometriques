<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">Deux bases parallèles et une hauteur</title><desc id="desc">Les bases mesurent 10 et 6 cm, la hauteur 4 cm et le segment médian 8 cm. Aire 32 cm carrés.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><polygon points="160,250 460,250 400,130 220,130" fill="#e8f2fb" stroke="#174d76" stroke-width="3"/><line x1="220" y1="130" x2="220" y2="250" stroke="#174d76" stroke-width="3" stroke-dasharray="7 5"/><line x1="190" y1="190" x2="430" y2="190" stroke="#b45309" stroke-width="3" stroke-dasharray="7 5"/><polygon points="220,236 234,236 234,250 220,250" fill="none" stroke="#174d76" stroke-width="2"/><text x="310" y="112" font-size="19" fill="#172b3a" text-anchor="middle">6 cm</text><text x="310" y="286" font-size="19" fill="#172b3a" text-anchor="middle">10 cm</text><text x="258" y="225" font-size="17" fill="#172b3a" text-anchor="middle">4 cm</text><text x="321" y="180" font-size="16" fill="#172b3a" text-anchor="middle">segment médian : 8 cm</text></g></svg>