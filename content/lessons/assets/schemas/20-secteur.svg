<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">Un quart de disque</title><desc id="desc">Le disque a un rayon de 4 cm. Le secteur de 90 degrés a pour aire 4 pi cm carrés et son arc mesure 2 pi cm.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><circle cx="250" cy="200" r="120" fill="#eff6fb" stroke="#174d76" stroke-width="3"/><path d="M250,200 L370,200 A120,120 0 0,0 250,80 Z" fill="#dbeafe" stroke="#174d76" stroke-width="3"/><polygon points="250,185 265,185 265,200 250,200" fill="none" stroke="#174d76" stroke-width="2"/><text x="235" y="224" font-size="19" fill="#172b3a" text-anchor="middle">O</text><text x="314" y="222" font-size="19" fill="#172b3a" text-anchor="middle">4 cm</text><text x="300" y="166" font-size="19" fill="#172b3a" text-anchor="middle">90°</text><text x="430" y="95" font-size="17" fill="#172b3a" text-anchor="middle">arc : 2π cm</text><text x="447" y="126" font-size="17" fill="#172b3a" text-anchor="middle">aire : 4π cm²</text><line x1="373" y1="107" x2="335" y2="116" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/></g></svg>