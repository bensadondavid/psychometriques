<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">Triangle des milieux</title><desc id="desc">D et E sont les milieux de AB et AC. Le triangle ADE a des côtés deux fois plus petits et une aire quatre fois plus petite que ABC.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><polygon points="300,45 120,285 480,285" fill="#e8f2fb" stroke="#174d76" stroke-width="3"/><polygon points="300,45 210,165 390,165" fill="#dbeafe" stroke="#174d76" stroke-width="3"/><text x="300" y="28" font-size="19" fill="#172b3a" text-anchor="middle">A</text><text x="102" y="302" font-size="19" fill="#172b3a" text-anchor="middle">B</text><text x="498" y="302" font-size="19" fill="#172b3a" text-anchor="middle">C</text><text x="190" y="168" font-size="19" fill="#172b3a" text-anchor="middle">D</text><text x="410" y="168" font-size="19" fill="#172b3a" text-anchor="middle">E</text><text x="300" y="159" font-size="16" fill="#172b3a" text-anchor="middle">DE</text><text x="300" y="320" font-size="17" fill="#172b3a" text-anchor="middle">D et E sont les milieux ; DE // BC</text></g></svg>